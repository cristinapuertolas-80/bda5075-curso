version: 2
models:
  - name: stg_alertas
    description: "Reportes anti-cheat a auditar"
    columns:
      - name: id_alerta
        tests: [unique, not_null]

      - name: severidad
        tests:
          - not_null
          - accepted_values:
              values: ["baja", "media", "alta", "critica"]

